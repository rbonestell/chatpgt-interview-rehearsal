name: Check plugin package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python3 -m json.tool .agents/plugins/marketplace.json > /dev/null
      - run: node scripts/bundle-plugin.mjs
      - run: git diff --check
