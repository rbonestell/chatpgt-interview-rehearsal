name: Check MCP workspace
on:
  pull_request:
  push:
    branches: [main, feat/mcp-ui]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:worker
      - run: npx wrangler deploy --dry-run --outdir temp/worker
      - run: node scripts/bundle-plugin.mjs
      - run: git diff --check
